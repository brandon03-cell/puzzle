<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="puzzle.css" />
    <title>Puzzle deslizante</title>
  </head>
  <body>
    <div class="app">
      <header class="cabecera">
        <h1>Puzzle deslizante</h1>
        <p>Mueve las fichas hasta ordenarlas del 1 al 8</p>
      </header>

      <div class="stats">
        <div class="stat">
          <div class="stat-val" id="movs">0</div>
          <div class="stat-lbl">movimientos</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="tiempo">0:00</div>
          <div class="stat-lbl">tiempo</div>
        </div>
      </div>

      <div class="tablero" id="tablero" role="grid" aria-label="Tablero del puzzle"></div>

      <p class="mensaje" id="mensaje" aria-live="polite"></p>

      <div class="acciones">
        <button id="btnMezclar">Mezclar</button>
        <button id="btnReset">Reiniciar</button>
      </div>
    </div>

    <script src="puzzle.js"></script>
  </body>
</html>
