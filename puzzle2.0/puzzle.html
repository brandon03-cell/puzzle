<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="puzzle.css" />
    <title>Puzzle deslizante</title>
  </head>
  <body>
    <header>
      <h1>Puzzle deslizante</h1>
      <p class="subtitulo">Ordena las piezas del 1 al 8</p>
    </header>

    <main>
      <div class="tablero" role="grid" aria-label="Tablero del puzzle">

        <!-- Fila 1 -->
        <div class="pieza" role="gridcell">1</div>
        <div class="pieza" role="gridcell">2</div>
        <div class="pieza" role="gridcell">3</div>

        <!-- Fila 2 -->
        <div class="pieza" role="gridcell">4</div>
        <div class="pieza vacia" role="gridcell" aria-label="Espacio vacío"></div>
        <div class="pieza" role="gridcell">5</div>

        <!-- Fila 3 -->
        <div class="pieza" role="gridcell">6</div>
        <div class="pieza" role="gridcell">7</div>
        <div class="pieza" role="gridcell">8</div>

      </div>

      <p class="nota">Este puzzle es solo HTML y CSS — sin JavaScript.</p>
    </main>

    <footer>
      <p>Proyecto de aprendizaje · Mejorado en 2025</p>
    </footer>
  </body>
</html>
